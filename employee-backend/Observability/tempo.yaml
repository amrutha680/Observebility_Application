server:
  http_listen_port: 3200     # Tempo HTTP API for Grafana queries
  grpc_listen_port: 9096     # Changed to avoid conflicts

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # OTLP gRPC receiver
        http:
          endpoint: 0.0.0.0:4318   # OTLP HTTP receiver

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1000000   # 1 MB
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

# Optional: Add metrics endpoint
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true